# Serves images/ and locales/. File names carry no content hash, so every file is revalidated
# (ETag) instead of being cached as immutable. CORS stays open so the assets can also be loaded
# from another origin (a dev server opened standalone, a CDN).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Workspace spec 086: the locales are large JSON files (common is ~450 KB, ~130 KB compressed).
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types application/json image/svg+xml text/plain;

  location / {
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }
}
